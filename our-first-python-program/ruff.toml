target-version = "py314"
preview = false
unsafe-fixes = false
show-fixes = true

[format]
docstring-code-format = true

[lint]
select = [
    # Core correctness and formatting-adjacent checks.
    "E",
    "F",
    "W",
    "I",

    # Common defects and exception handling.
    "B",
    "BLE",
    "C4",
    "DTZ",
    "RSE",
    "S",

    # Modern and idiomatic Python.
    "UP",
    "SIM",
    "PIE",
    "RET",
    "FLY",
    "FURB",
    "PERF",
    "PTH",
    "RUF",

    # APIs, names, imports, logging, and typing.
    "A",
    "ANN",
    "ARG",
    "ASYNC",
    "G",
    "ICN",
    "LOG",
    "N",
    "TC",

    # High-signal subset of Pylint-derived checks.
    "PLE",
    "PLW",

    # Testing and exception-style policy.
    "PT",
    "TRY",
]

ignore = [
    # Ruff formatter incompatibilities.
    "E111",
    "E114",
    "E117",
    "W191",

    # Formatter uses line length as a target, not an absolute guarantee.
    "E501",

    # Opinionated exception-structure rules.
    "TRY003",
    "TRY300",
    "TRY301",
]

# Keep reporting unused imports, but require manual review before deletion.
unfixable = ["F401"]

[lint.per-file-ignores]
"**/tests/**/*.py" = [
    "S101", # assert is expected in tests
]
